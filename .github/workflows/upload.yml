name: upload
on:
  workflow_dispatch:
    inputs:
      chat_id:    { description: Telegram chat id, required: true }
      message_id: { description: Telegram message id, required: true }

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 340          # GitHub hard limit is 6 h per job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: uploader/requirements.txt }
      - run: pip install -r uploader/requirements.txt
      - run: python uploader/upload.py
        env:
          CHAT_ID: ${{ inputs.chat_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DEFAULT_PRIVACY: ${{ vars.DEFAULT_PRIVACY || 'private' }}
